mutation UpdateReceivablePayment(
  $workspaceId: UUID!
  $receivableId: UUID!
  $paidMinor: Int64!
  $status: String!
) @auth(level: USER) @transaction {
  query
    @check(
      expr: "response.query.memberships.size() == 1"
      message: "No tienes acceso a este workspace."
    )
    @redact {
    memberships(
      where: {
        workspaceId: {eq: $workspaceId}
        userUid: {eq_expr: "auth.uid"}
        status: {eq: "active"}
      }
      limit: 1
    ) {
      role
    }
  }

  receivable_update(
    first: {
      where: {
        id: {eq: $receivableId}
        workspaceId: {eq: $workspaceId}
      }
    }
    data: {
      paidMinor: $paidMinor
      status: $status
      updatedAt_expr: "request.time"
    }
  )
}

