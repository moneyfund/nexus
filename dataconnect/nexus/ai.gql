  $conversationId: UUID
  $tool: String!
  $action: String!
  $status: String!
  $riskLevel: String!
  $requiresConfirmation: Boolean!
  $input: Any
  $result: Any
  $error: String
) @auth(level: USER) @transaction {
  query
    @check(
      expr: "response.query.memberships.size() == 1"
      message: "No tienes acceso a este workspace."
    )
    @redact {
    memberships(
      where: {
        workspaceId: {eq: $workspaceId}
        userUid: {eq_expr: "auth.uid"}
        status: {eq: "active"}
      }
      limit: 1
    ) {
      role
    }
  }

  aiToolAction_insert(
    data: {
      workspaceId: $workspaceId
      userUid_expr: "auth.uid"
      conversationId: $conversationId
      tool: $tool
      action: $action
      status: $status
      riskLevel: $riskLevel
      requiresConfirmation: $requiresConfirmation
      input: $input
      result: $result
      error: $error
    }
  )
}
