name: NEXUS Firebase CD

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_96795 }}

      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix functions

      - name: Validate Functions
        run: |
          node --check functions/index.js
          for file in functions/scripts/*.mjs; do
            node --check "$file"
          done

      - name: Deploy Firebase backend
        run: >
          firebase deploy
          --only functions,firestore:rules,storage
          --project nexus-96795
          --non-interactive
