name: NEXUS Firebase Deploy Once

on:
  push:
    branches:
      - ops/deploy-debt-ai-once
    paths:
      - "functions/**"
      - ".github/workflows/deploy-nexus-ai-once.yml"

permissions:
  contents: read

concurrency:
  group: nexus-firebase-deploy-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_TOKEN_PRIMARY: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_TOKEN_ALT: ${{ secrets.FIREBASE_CLI_TOKEN }}
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix functions

      - name: Validate Functions
        run: node --check functions/index.js

      - name: Deploy NEXUS AI functions
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${FIREBASE_TOKEN_PRIMARY:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${FIREBASE_TOKEN_ALT:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "No Firebase deployment credential is configured in GitHub Actions."
            exit 2
          fi
          firebase deploy --only functions --project nexus-96795 --non-interactive --token "$TOKEN"
