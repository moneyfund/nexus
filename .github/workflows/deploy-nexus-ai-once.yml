name: NEXUS Firebase Deploy Once

on:
  push:
    branches:
      - ops/deploy-debt-ai-once
    paths:
      - "functions/**"
      - ".github/workflows/deploy-nexus-ai-once.yml"

permissions:
  contents: read

concurrency:
  group: nexus-firebase-deploy-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_96795 }}

      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix functions

      - name: Validate Functions
        run: node --check functions/index.js

      - name: Deploy NEXUS AI functions
        run: >
          firebase deploy
          --only functions
          --project nexus-96795
          --non-interactive
