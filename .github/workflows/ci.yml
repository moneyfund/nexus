name: Nexus CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dataconnect:generate
      - name: Upload generated SQL Connect SDKs
        uses: actions/upload-artifact@v4
        with:
          name: dataconnect-generated
          path: |
            src/dataconnect-generated
            src/dataconnect-admin
          if-no-files-found: error
          retention-days: 3
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
